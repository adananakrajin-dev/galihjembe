<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SESSIONS | Premium Web Development</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* ── RESET & PREMIUM OBSIDIAN THEME ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body, html {
            height: 100%;
            overflow-x: hidden;
            background-color: #050505;
            background-image: radial-gradient(circle at 50% 0%, #151c2c 0%, #050505 70%);
            background-attachment: fixed;
            color: #ffffff;
        }

        /* ── CURSOR SPOTLIGHT ── */
        .cursor-spotlight {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(255,255,255,0.035) 0%, transparent 70%);
            transition: opacity 0.4s ease;
            opacity: 0;
        }

        /* ── PARTICLE CANVAS ── */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* ── SHIMMER SCAN LINE ── */
        .shimmer-line {
            position: fixed;
            top: -2px;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.08) 40%, rgba(255,255,255,0.18) 50%, rgba(255,255,255,0.08) 60%, transparent 100%);
            pointer-events: none;
            z-index: 1;
            animation: shimmerScan 7s ease-in-out infinite;
            opacity: 0;
        }

        @keyframes shimmerScan {
            0%   { top: -2px; opacity: 0; }
            5%   { opacity: 1; }
            95%  { opacity: 1; }
            100% { top: 100vh; opacity: 0; }
        }

        /* ── TRANSPARENT OVERLAY NAVBAR ── */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 4%;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            background: transparent;
            animation: fadeDownModern 1s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .nav-brand {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 4px; 
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        .nav-brand:hover {
            opacity: 0.7;
        }

        .nav-center {
            display: flex;
            gap: 24px;
        }

        .nav-center a {
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: opacity 0.3s ease;
            opacity: 0.85;
        }

        .nav-center a:hover {
            opacity: 1;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-right a {
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            opacity: 0.85;
            transition: all 0.3s ease;
        }

        .nav-right a:hover {
            opacity: 1;
        }

        /* ── HERO FULLSCREEN ── */
        .hero {
            position: relative;
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        /* Center Content & Interactive Animations */
        .hero-content {
            margin-bottom: 60px;
            animation: scaleInModern 1.2s cubic-bezier(0.16, 1, 0.3, 1) both;
            position: relative;
            z-index: 2;
        }

        .hero-content h1 {
            font-size: 44px;
            font-weight: 500;
            letter-spacing: 2px;
            margin-bottom: 12px;
            animation: floatText 4s ease-in-out infinite;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }

        /* ── CHAR REVEAL SPANS (injected by JS) ── */
        .hero-content h1 .char {
            display: inline-block;
            opacity: 0;
            transform: translateY(20px);
            animation: charReveal 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes charReveal {
            to { opacity: 1; transform: translateY(0); }
        }

        .hero-content p {
            font-size: 15px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.5px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* ── SUBTITLE TYPEWRITER ── */
        .hero-content p .typewriter-text {
            border-right: 1px solid rgba(255,255,255,0.4);
            white-space: normal;
            overflow: hidden;
            display: inline;
            animation: typewriterBlink 0.75s step-end infinite;
        }

        .hero-content p .typewriter-text.done {
            border-right: none;
            animation: none;
        }

        @keyframes typewriterBlink {
            50% { border-color: transparent; }
        }

        /* ── BOTTOM STATS STRIP ── */
        .hero-stats {
            position: absolute;
            bottom: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 60px;
            width: 100%;
            max-width: 900px;
            padding: 0 20px;
            z-index: 2;
        }

        .stat-box {
            text-align: center;
            flex: 1;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUpModern 1.2s cubic-bezier(0.16, 1, 0.3, 1) both;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), filter 0.4s ease;
            position: relative;
        }

        .stat-box:hover {
            transform: translateY(-6px) scale(1.04);
            filter: drop-shadow(0 10px 20px rgba(255, 255, 255, 0.1));
        }

        /* Staggered Delay */
        .stat-box:nth-child(1) { animation-delay: 0.3s; }
        .stat-divider:nth-child(2) { animation: fadeIn 1s ease both; animation-delay: 0.45s; opacity: 0; }
        .stat-box:nth-child(3) { animation-delay: 0.5s; }
        .stat-divider:nth-child(4) { animation: fadeIn 1s ease both; animation-delay: 0.65s; opacity: 0; }
        .stat-box:nth-child(5) { animation-delay: 0.7s; }

        .stat-box h2 {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .stat-box i {
            font-size: 24px;
            margin-bottom: 12px;
            color: rgba(255, 255, 255, 0.8);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), color 0.4s ease;
            display: block;
        }
        
        .stat-box:hover i {
            transform: scale(1.15);
            color: #ffffff;
        }

        .stat-box p {
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 1.5px;
        }

        .stat-divider {
            width: 1px;
            height: 35px;
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* ── VIDEO/PLAY CONTROL ── */
        .video-control {
            position: absolute;
            bottom: 50px;
            left: 4%;
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(4px);
            opacity: 0;
            animation: fadeIn 1.2s ease both 0.9s, pulseGlow 3s infinite alternate 2s;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 2;
        }
        
        .video-control:hover {
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.5);
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.08);
            animation-play-state: paused;
        }

        /* ── MODERN SMOOTH ANIMATIONS ── */
        @keyframes fadeDownModern {
            from { opacity: 0; transform: translateY(-20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeUpModern {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleInModern {
            from { opacity: 0; transform: scale(0.96) translateY(15px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        @keyframes floatText {
            0%   { transform: translateY(0px); text-shadow: 0 0 15px rgba(255, 255, 255, 0.05); }
            50%  { transform: translateY(-8px); text-shadow: 0 10px 25px rgba(255, 255, 255, 0.15); }
            100% { transform: translateY(0px); text-shadow: 0 0 15px rgba(255, 255, 255, 0.05); }
        }
        @keyframes pulseGlow {
            0%   { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 15px 2px rgba(255, 255, 255, 0.1); }
        }

        /* ── RESPONSIVE HANDLING ── */
        @media (max-width: 768px) {
            .nav-center { display: none; }
            nav { padding: 25px 6%; }
            .hero-content h1 { font-size: 32px; }
            .hero-content p { font-size: 12px; padding: 0 20px; max-width: 280px; line-height: 1.6; }
            
            .hero-stats {
                bottom: 110px;
                gap: 20px;
                flex-direction: row;
                flex-wrap: wrap;
            }
            .stat-box h2 { font-size: 18px; }
            .stat-box p { font-size: 9px; }
            .stat-divider { display: none; }

            .video-control {
                left: 50%;
                transform: translateX(-50%);
                bottom: 40px;
                animation: fadeIn 1.2s ease both 0.9s; 
            }
            .video-control:hover {
                transform: translateX(-50%) scale(1.1);
            }

            .cursor-spotlight { display: none; }
        }
    </style>
</head>
<body>

    <!-- Cursor Spotlight -->
    <div class="cursor-spotlight" id="cursorSpotlight"></div>

    <!-- Particle Canvas -->
    <canvas id="particle-canvas"></canvas>

    <!-- Shimmer Scan Line -->
    <div class="shimmer-line"></div>

    <nav>
        <div class="nav-brand">SESSIONS</div>
    </nav>

    <section class="hero">
        
        <div class="hero-content">
            <h1 id="heroTitle">SESSIONS</h1>
            <p><span class="typewriter-text" id="subtitle"></span></p>
        </div>

        <div class="hero-stats">
            <a href="contact.html" class="stat-box" style="text-decoration: none; color: inherit; display: block;">
                <i class="fa-solid fa-address-book"></i>
                <p>Contact</p>
            </a>
            
            <div class="stat-divider"></div>
            
            <a href="credit.html" class="stat-box" style="text-decoration: none; color: inherit; display: block;">
                <i class="fa-solid fa-credit-card"></i>
                <p>Credit</p>
            </a>
            
            <div class="stat-divider"></div>
            
            <a href="portofolio.html" class="stat-box" style="text-decoration: none; color: inherit; display: block;">
                <i class="fa-solid fa-briefcase"></i>
                <p>Portofolio</p>
            </a>
        </div>

        <a href="login.php" class="video-control" style="text-decoration: none; display: inline-block;">
            <i class="fa-solid fa-play"></i>
        </a>

    </section>

    <script>
        /* ── 1. CURSOR SPOTLIGHT ── */
        const spotlight = document.getElementById('cursorSpotlight');
        let spotX = window.innerWidth / 2, spotY = window.innerHeight / 2;
        let currentX = spotX, currentY = spotY;
        let spotVisible = false;

        document.addEventListener('mousemove', (e) => {
            spotX = e.clientX;
            spotY = e.clientY;
            if (!spotVisible) {
                spotlight.style.opacity = '1';
                spotVisible = true;
            }
        });

        document.addEventListener('mouseleave', () => {
            spotlight.style.opacity = '0';
            spotVisible = false;
        });

        function animateSpotlight() {
            currentX += (spotX - currentX) * 0.07;
            currentY += (spotY - currentY) * 0.07;
            spotlight.style.left = currentX + 'px';
            spotlight.style.top = currentY + 'px';
            requestAnimationFrame(animateSpotlight);
        }
        animateSpotlight();

        /* ── 2. AMBIENT PARTICLES ── */
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const particles = [];
        const PARTICLE_COUNT = 55;

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            particles.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                r: Math.random() * 1.2 + 0.3,
                alpha: Math.random() * 0.35 + 0.05,
                vx: (Math.random() - 0.5) * 0.18,
                vy: (Math.random() - 0.5) * 0.18,
                pulse: Math.random() * Math.PI * 2,
                pulseSpeed: Math.random() * 0.012 + 0.006
            });
        }

        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.pulse += p.pulseSpeed;

                if (p.x < -5) p.x = canvas.width + 5;
                if (p.x > canvas.width + 5) p.x = -5;
                if (p.y < -5) p.y = canvas.height + 5;
                if (p.y > canvas.height + 5) p.y = -5;

                const dynamicAlpha = p.alpha * (0.6 + 0.4 * Math.sin(p.pulse));

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${dynamicAlpha})`;
                ctx.fill();
            });
            requestAnimationFrame(drawParticles);
        }
        drawParticles();

        /* ── 3. MAGNETIC ICON + TOUCH RIPPLE pada stat-box ── */
        document.querySelectorAll('.stat-box').forEach(box => {
            const icon = box.querySelector('i');

            /* Magnetic (desktop) */
            box.addEventListener('mousemove', (e) => {
                const rect = box.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const dx = (e.clientX - cx) * 0.28;
                const dy = (e.clientY - cy) * 0.28;
                if (icon) icon.style.transform = `translate(${dx}px, ${dy}px) scale(1.15)`;
            });
            box.addEventListener('mouseleave', () => {
                if (icon) icon.style.transform = 'translate(0, 0) scale(1)';
            });

            /* Ripple + flash — touchstart only, jangan intercept click agar navigasi tetap jalan */
            box.addEventListener('touchstart', (e) => {
                const t = e.touches[0];
                const rect = box.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height) * 1.5;
                const ripple = document.createElement('span');
                ripple.classList.add('ripple');
                ripple.style.cssText = `width:${size}px;height:${size}px;left:${t.clientX - rect.left - size/2}px;top:${t.clientY - rect.top - size/2}px;`;
                box.appendChild(ripple);
                ripple.addEventListener('animationend', () => ripple.remove(), { once: true });

                box.classList.add('tap-flash');
                box.addEventListener('animationend', () => box.classList.remove('tap-flash'), { once: true });
            }, { passive: true });
        });

        /* ── 4. CHARACTER REVEAL pada H1 ── */
        const heroTitle = document.getElementById('heroTitle');
        const titleText = heroTitle.textContent;
        heroTitle.textContent = '';

        titleText.split('').forEach((char, i) => {
            const span = document.createElement('span');
            span.classList.add('char');
            span.textContent = char === ' ' ? '\u00A0' : char;
            span.style.animationDelay = (0.4 + i * 0.07) + 's';
            heroTitle.appendChild(span);
        });

        /* ── 5. TYPEWRITER pada SUBTITLE ── */
        const subtitleEl = document.getElementById('subtitle');
        const subtitleText = 'Accelerating the World\'s Transition to High-End Digital Presence';
        let charIndex = 0;

        function typeWriter() {
            if (charIndex < subtitleText.length) {
                subtitleEl.textContent += subtitleText[charIndex];
                charIndex++;
                setTimeout(typeWriter, 32);
            } else {
                subtitleEl.classList.add('done');
            }
        }

        setTimeout(typeWriter, 1600);
        /* ── Bersihkan state saat user back dari halaman lain ── */
        window.addEventListener('pageshow', () => {
            document.querySelectorAll('.stat-box').forEach(box => {
                box.classList.remove('tap-flash');
                const icon = box.querySelector('i');
                if (icon) icon.style.transform = 'translate(0,0) scale(1)';
            });
        });
    </script>

</body>
</html>
