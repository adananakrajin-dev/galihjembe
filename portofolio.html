<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SESSIONS | Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body, html {
            min-height: 100vh; /* Ganti height: 100% jadi min-height */
            display: flex; /* Tambahin ini */
            flex-direction: column; /* Tambahin ini */
            overflow-x: hidden;
            background-color: #050505;
            background-image: radial-gradient(circle at 50% 0%, #151c2c 0%, #050505 70%);
            background-attachment: fixed;
            color: #ffffff;
        }

        /* ── CURSOR SPOTLIGHT ── */
        .cursor-spotlight {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(255,255,255,0.035) 0%, transparent 70%);
            transition: opacity 0.4s ease;
            opacity: 0;
        }

        /* ── PARTICLE CANVAS ── */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* ── SHIMMER SCAN LINE ── */
        .shimmer-line {
            position: fixed;
            top: -2px;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.08) 40%, rgba(255,255,255,0.18) 50%, rgba(255,255,255,0.08) 60%, transparent 100%);
            pointer-events: none;
            z-index: 1;
            animation: shimmerScan 7s ease-in-out infinite;
            opacity: 0;
        }

        @keyframes shimmerScan {
            0%   { top: -2px; opacity: 0; }
            5%   { opacity: 1; }
            95%  { opacity: 1; }
            100% { top: 100vh; opacity: 0; }
        }
         /* ── SOLID NATURAL NAVBAR (Fix Turun-Turun) ── */
        /* ── TRANSPARENT OVERLAY NAVBAR ── */
        nav {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 25px 4%; /* Padding disamain persis kaya index */
            background: transparent;
            width: 100%;
            /* Absolute dibuang biar dia jadi struktur solid yang gak bakal lompat/geser */
            animation: fadeDownModern 1s ease-out both;
        }

        /* Nav Brand (SESSIONS) 100% Konsisten sama Index */
        .nav-brand {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 4px;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        .nav-brand:hover {
            opacity: 0.7;
        }


        /* ── HERO ── */
        .hero {
            padding: 50px 6% 20px;
            text-align: center;
            max-width: 560px;
            margin: 0 auto;
        }
        .hero-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 10px;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.3);
            text-transform: uppercase;
            margin-bottom: 18px;
            opacity: 0;
            animation: fadeUp 0.8s 0.3s ease-out forwards;
        }
        .hero-eyebrow span { width: 18px; height: 1px; background: rgba(255,255,255,0.2); display: inline-block; }
        .hero h1 {
            font-size: clamp(30px, 6vw, 50px);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -1.5px;
            margin-bottom: 14px;
            opacity: 0;
            animation: fadeUp 0.8s 0.45s ease-out forwards;
        }
        .hero h1 em {
            font-style: normal;
            background: linear-gradient(120deg, #fff 30%, #6366f1, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero-sub {
            font-size: 13px;
            color: rgba(255,255,255,0.35);
            line-height: 1.8;
            opacity: 0;
            animation: fadeUp 0.8s 0.6s ease-out forwards;
        }

        /* ── CAROUSEL ── */
        .carousel-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 44px 0 60px;
        }
        .section-label {
            font-size: 10px;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.25);
            text-transform: uppercase;
            margin-bottom: 40px;
            opacity: 0;
            animation: fadeUp 0.8s 0.8s ease-out forwards;
        }

        /* ── FAN STAGE ── */
        .fan-stage {
            position: relative;
            width: 100%;
            height: 460px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            animation: fadeUp 0.9s 1s ease-out forwards;
        }

        /* ── CARD ── */
        .fan-card {
            position: absolute;
            width: 220px;
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            will-change: transform, opacity, filter;
            transition:
                transform 0.55s cubic-bezier(0.34, 1.4, 0.64, 1),
                opacity   0.45s ease,
                filter    0.45s ease,
                box-shadow 0.45s ease;
            transform-origin: center 110%;
            text-decoration: none;
            display: block;
        }

        /* Image fills whole card — no separate body */
        .fan-card-img {
            width: 100%;
            height: 320px;
            background-size: cover;
            background-position: center;
            position: relative;
            transition: transform 0.6s ease;
        }
        .fan-card:hover .fan-card-img { transform: scale(1.04); }

        /* Gradient overlay bottom */
        .fan-card-img::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top,
                rgba(5,8,18,0.97) 0%,
                rgba(5,8,18,0.5) 45%,
                transparent 100%);
        }

        /* Text overlay on photo */
        .fan-card-info {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 20px 18px 18px;
            z-index: 2;
        }
        .fan-card-info h3 {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
            line-height: 1.2;
        }
        .fan-card-info small {
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        /* Counter top-left */
        .card-counter {
            position: absolute;
            top: 14px; left: 14px;
            font-size: 10px;
            color: rgba(255,255,255,0.5);
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(6px);
            padding: 3px 9px;
            border-radius: 10px;
            z-index: 3;
        }

        /* Category badge top-right */
        .card-badge {
            position: absolute;
            top: 14px; right: 14px;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.8);
            padding: 4px 11px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 500;
            z-index: 3;
        }

        /* ── POSITIONS ── */
        .fan-card[data-pos="-2"] {
            transform: translateX(-330px) rotate(-15deg) scale(0.65);
            opacity: 0.2; filter: blur(2px); z-index: 1;
        }
        .fan-card[data-pos="-1"] {
            transform: translateX(-195px) rotate(-7deg) scale(0.82);
            opacity: 0.6; filter: blur(0.5px); z-index: 2;
        }
        .fan-card[data-pos="0"] {
            transform: translateX(0) rotate(0deg) scale(1);
            opacity: 1; filter: none; z-index: 5;
            box-shadow: 0 40px 100px rgba(0,0,0,0.7), 0 0 50px rgba(99,102,241,0.1);
        }
        .fan-card[data-pos="1"] {
            transform: translateX(195px) rotate(7deg) scale(0.82);
            opacity: 0.6; filter: blur(0.5px); z-index: 2;
        }
        .fan-card[data-pos="2"] {
            transform: translateX(330px) rotate(15deg) scale(0.65);
            opacity: 0.2; filter: blur(2px); z-index: 1;
        }

        /* Ripple */
        .fan-card.ripple::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0.07);
            animation: rippleAnim 0.4s ease-out forwards;
            pointer-events: none;
            z-index: 10;
        }
        @keyframes rippleAnim {
            from { opacity:1; }
            to   { opacity:0; transform:scale(1.03); }
        }

        /* ── DOTS ── */
        .carousel-dots {
            display: flex;
            gap: 7px;
            margin-top: 44px;
            opacity: 0;
            animation: fadeUp 0.7s 1.2s ease-out forwards;
        }
        .dot {
            width: 6px; height: 6px;
            border-radius: 3px;
            background: rgba(255,255,255,0.2);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34,1.4,0.64,1);
        }
        .dot.active { width: 22px; background: #fff; }

        /* ── NAV BUTTONS ── */
        .carousel-nav {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            opacity: 0;
            animation: fadeUp 0.7s 1.3s ease-out forwards;
        }
        .nav-btn {
            width: 40px; height: 40px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.04);
            color: #fff;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px;
            transition: background 0.3s, border-color 0.3s, transform 0.2s;
        }
        .nav-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.25); }
        .nav-btn:active { transform: scale(0.92); }

        /* ── FOOTER ── */
        footer {
            text-align: center;
            padding: 24px;
            border-top: 1px solid rgba(255,255,255,0.04);
            font-size: 12px;
            color: rgba(255,255,255,0.2);
            letter-spacing: 0.5px;
        }

        /* ── KEYFRAMES ── */
        @keyframes fadeUp {
            from { opacity:0; transform: translateY(24px); }
            to   { opacity:1; transform: translateY(0); }
        }

        /* ── MOBILE ── */
        @media (max-width: 640px) {
            .fan-stage { height: 420px; }
            .fan-card { width: 180px; }
            .fan-card-img { height: 280px; }

            .fan-card[data-pos="-2"],
            .fan-card[data-pos="2"] { display: none; }

            .fan-card[data-pos="-1"] {
                transform: translateX(-120px) rotate(-7deg) scale(0.78);
                opacity: 0.4; filter: blur(1px);
            }
            .fan-card[data-pos="1"] {
                transform: translateX(120px) rotate(7deg) scale(0.78);
                opacity: 0.4; filter: blur(1px);
            }
            /* sembunyiin teks card samping di mobile biar ga numpuk */
            .fan-card[data-pos="-1"] .fan-card-info,
            .fan-card[data-pos="1"]  .fan-card-info,
            .fan-card[data-pos="-1"] .card-badge,
            .fan-card[data-pos="1"]  .card-badge { display: none; }
        }
    </style>
</head>
<body>

<!-- Cursor Spotlight -->
    <div class="cursor-spotlight" id="cursorSpotlight"></div>

    <!-- Particle Canvas -->
    <canvas id="particle-canvas"></canvas>

    <!-- Shimmer Scan Line -->
    <div class="shimmer-line"></div>

<nav>
    <a href="javascript:history.back()" class="nav-brand">SESSIONS</a>
</nav>

<header class="hero">
    <div class="hero-eyebrow"></div>
    <h1>Built with <em>Purpose.</em></h1>
    <p class="hero-sub">Kumpulan project web yang telah kami kerjakan — klik card untuk melihat langsung.</p>
</header>

<section class="carousel-section">
    <p class="section-label">— Portfolio —</p>
    <div class="fan-stage" id="fanStage"></div>
    <div class="carousel-dots" id="dots"></div>
    <div class="carousel-nav">
        <button class="nav-btn" id="prevBtn">&#8249;</button>
        <button class="nav-btn" id="nextBtn">&#8250;</button>
    </div>
</section>

<footer>&copy; 2026 SESSIONS &nbsp;·&nbsp; Build with passion.</footer>

<script>
// ── GANTI DATA DI SINI ──
const projects = [
    {
        title: "StudyHub",
        category: "E-Commerce",
        img: "img1.jpeg",
        url: "https://ahdan10.ukk-rpl.site/home.html" // ganti link
    },
    {
        title: "Jakarta Studio",
        category: "Company Profile",
        img: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=900&auto=format&fit=crop",
        url: "http://127.0.0.1:5501/index.html"
    },
    {
        title: "Surat Romantis",
        category: "Web Letter",
        img: "https://images.unsplash.com/photo-1455390582262-044cdead277a?auto=format&fit=crop&w=600&q=80",
        url: "http://127.0.0.1:5502/index.html"
    },
    {
        title: "Prosata",
        category: "Landing Page",
        img: "https://i.pinimg.com/736x/6d/6a/32/6d6a328afca8c3c9acb87572cb5f14d7.jpg",
        url: "http://127.0.0.1:5500/index.html"
    }
];

let current = 0;
const total = projects.length;
let isAnimating = false;

function getPos(i) {
    let d = i - current;
    if (d > total/2) d -= total;
    if (d < -total/2) d += total;
    return d;
}

function buildCard(p, index) {
    const card = document.createElement('a');
    card.className = 'fan-card';
    card.dataset.index = index;
    card.href = p.url;
    card.target = '_blank';
    card.rel = 'noopener noreferrer';

    card.innerHTML = `
        <div class="fan-card-img" style="background-image:url('${p.img}')">
            <div class="card-counter">${index+1} / ${total}</div>
            <div class="card-badge">${p.category}</div>
            <div class="fan-card-info">
                <h3>${p.title}</h3>
                <small>Tap to visit</small>
            </div>
        </div>`;

    // Klik card samping → pindah; klik center → buka link
    card.addEventListener('click', (e) => {
        const pos = getPos(parseInt(card.dataset.index));
        if (pos !== 0) {
            e.preventDefault();
            goTo(current + (pos < 0 ? -1 : 1));
        }
    });

    return card;
}

function renderStage() {
    const stage = document.getElementById('fanStage');
    stage.innerHTML = '';

    const order = [...Array(total).keys()].sort((a,b) => Math.abs(getPos(b)) - Math.abs(getPos(a)));
    order.forEach(i => {
        const card = buildCard(projects[i], i);
        const pos = getPos(i);
        card.dataset.pos = Math.max(-2, Math.min(2, pos));
        if (Math.abs(pos) > 2) card.style.display = 'none';
        stage.appendChild(card);
    });

    const dotsEl = document.getElementById('dots');
    dotsEl.innerHTML = '';
    for (let i = 0; i < total; i++) {
        const d = document.createElement('div');
        d.className = 'dot' + (i === current ? ' active' : '');
        d.addEventListener('click', () => goTo(i));
        dotsEl.appendChild(d);
    }
}

function goTo(n) {
    if (isAnimating) return;
    isAnimating = true;
    current = ((n % total) + total) % total;
    renderStage();
    const center = document.querySelector('.fan-card[data-pos="0"]');
    if (center) {
        center.classList.add('ripple');
        center.addEventListener('animationend', () => center.classList.remove('ripple'), {once:true});
    }
    setTimeout(() => { isAnimating = false; }, 400);
}

document.getElementById('prevBtn').addEventListener('click', () => goTo(current - 1));
document.getElementById('nextBtn').addEventListener('click', () => goTo(current + 1));
document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') goTo(current - 1);
    if (e.key === 'ArrowRight') goTo(current + 1);
});

let tx = 0;
const stage = document.getElementById('fanStage');
stage.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, {passive:true});
stage.addEventListener('touchend', e => {
    const diff = tx - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 45) goTo(current + (diff > 0 ? 1 : -1));
});

renderStage();

/* ── 1. CURSOR SPOTLIGHT ── */
        const spotlight = document.getElementById('cursorSpotlight');
        let spotX = window.innerWidth / 2, spotY = window.innerHeight / 2;
        let currentX = spotX, currentY = spotY;
        let spotVisible = false;

        document.addEventListener('mousemove', (e) => {
            spotX = e.clientX;
            spotY = e.clientY;
            if (!spotVisible) {
                spotlight.style.opacity = '1';
                spotVisible = true;
            }
        });

        document.addEventListener('mouseleave', () => {
            spotlight.style.opacity = '0';
            spotVisible = false;
        });

        function animateSpotlight() {
            currentX += (spotX - currentX) * 0.07;
            currentY += (spotY - currentY) * 0.07;
            spotlight.style.left = currentX + 'px';
            spotlight.style.top = currentY + 'px';
            requestAnimationFrame(animateSpotlight);
        }
        animateSpotlight();

        /* ── 2. AMBIENT PARTICLES ── */
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const particles = [];
        const PARTICLE_COUNT = 55;

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            particles.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                r: Math.random() * 1.2 + 0.3,
                alpha: Math.random() * 0.35 + 0.05,
                vx: (Math.random() - 0.5) * 0.18,
                vy: (Math.random() - 0.5) * 0.18,
                pulse: Math.random() * Math.PI * 2,
                pulseSpeed: Math.random() * 0.012 + 0.006
            });
        }

        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.pulse += p.pulseSpeed;

                if (p.x < -5) p.x = canvas.width + 5;
                if (p.x > canvas.width + 5) p.x = -5;
                if (p.y < -5) p.y = canvas.height + 5;
                if (p.y > canvas.height + 5) p.y = -5;

                const dynamicAlpha = p.alpha * (0.6 + 0.4 * Math.sin(p.pulse));

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${dynamicAlpha})`;
                ctx.fill();
            });
            requestAnimationFrame(drawParticles);
        }
        drawParticles();

        /* ── 3. MAGNETIC ICON pada stat-box ── */
        document.querySelectorAll('.stat-box').forEach(box => {
            const icon = box.querySelector('i');

            box.addEventListener('mousemove', (e) => {
                const rect = box.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const dx = (e.clientX - cx) * 0.28;
                const dy = (e.clientY - cy) * 0.28;
                if (icon) icon.style.transform = `translate(${dx}px, ${dy}px) scale(1.15)`;
            });
            box.addEventListener('mouseleave', () => {
                if (icon) icon.style.transform = 'translate(0, 0) scale(1)';
            });
        });

        /* ── 4. CHARACTER REVEAL pada H1 ── */
        const heroTitle = document.getElementById('heroTitle');
        const titleText = heroTitle.textContent;
        heroTitle.textContent = '';

        titleText.split('').forEach((char, i) => {
            const span = document.createElement('span');
            span.classList.add('char');
            span.textContent = char === ' ' ? '\u00A0' : char;
            span.style.animationDelay = (0.4 + i * 0.07) + 's';
            heroTitle.appendChild(span);
        });

        /* ── 5. TYPEWRITER pada SUBTITLE ── */
        const subtitleEl = document.getElementById('subtitle');
        const subtitleText = 'Accelerating the World\'s Transition to High-End Digital Presence';
        let charIndex = 0;

        function typeWriter() {
            if (charIndex < subtitleText.length) {
                subtitleEl.textContent += subtitleText[charIndex];
                charIndex++;
                setTimeout(typeWriter, 32);
            } else {
                subtitleEl.classList.add('done');
            }
        }

        setTimeout(typeWriter, 1600);
</script>
</body>
</html>
